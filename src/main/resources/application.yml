
server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
    multipart:
      enabled: true

spring:
  application:
    name: handy_home
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

gemini:
  api:
    key: ${GEMINI_API_KEY}
fast-api:
  url : http://127.0.0.1:8000/predict-floor-plan